[package]
name = "helikodu-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

# Outside the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
helikodu-engine = { path = "../crates/engine", default-features = false }
helikodu-extra-decoders = { path = "../crates/extra-decoders", default-features = false, features = ["dsd", "openmpt", "gme", "sid", "midi"] }
helikodu-ffmpeg-bridge = { path = "../crates/ffmpeg-bridge" }
helikodu-library = { path = "../crates/library" }
helikodu-meta = { path = "../crates/meta" }
helikodu-model = { path = "../crates/model" }
helikodu-service = { path = "../crates/service", default-features = false, features = ["dsd"] }
toml = "1"

[[bin]]
name = "ffmpeg_bridge_open"
path = "fuzz_targets/ffmpeg_bridge_open.rs"
test = false
doc = false
bench = false

