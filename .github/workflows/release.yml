# Publishes a release. A version tag (v0.1.0) builds the source tarball with
# vendored crates and, from it, every release file for x86_64 and aarch64, and
# publishes them with a SHA256SUMS file as a GitHub Release whose notes are
# the tag's section of CHANGELOG.md. Started by hand, it is a dry run:
# everything is built and kept as workflow artifacts, and nothing is
# published.
#
# Each architecture builds on a native runner (aarch64 on GitHub's arm64
# runner, ubuntu-24.04-arm). The jobs after `source`:
#   build     the programs as .tar.xz and .tar.gz, in the Debian 13 container
#             of ci/containers: the oldest supported base (glibc 2.41, GTK
#             4.18, FFmpeg 7.1), so they run on that and newer systems that
#             still ship the FFmpeg 7 libraries
#   appimage  the AppImage, in the container of build-aux/appimage, with its
#             own minimal FFmpeg (docs/dev/appimage.md)
#   flatpak   the Flatpak as a single-file bundle (docs/dev/flatpak.md)
#   rpm       the Fedora package (docs/dev/packaging-rpm.md)
#   deb       the Debian 13 and Ubuntu 26.04 packages (docs/dev/packaging-deb.md)
#   arch      the Arch Linux package, x86_64 only (docs/dev/packaging-arch.md)
# Every container is capped at 12 GB of memory, the runners' limit
# (ci/README.md). See docs/dev/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Keeps each job under the 12 GB memory limit; see ci/README.md.
  CARGO_BUILD_JOBS: 4
  # The Fedora release the RPM is built for and named after (.fc45).
  FEDORA_RELEASE: "45"

jobs:
  source:
    name: Make the source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No cache: release files are built from a clean state only.
      - name: Build container
        run: docker build -t helikodu-ci:debian -f ci/containers/debian.Containerfile ci/containers
      - name: Make the source tarball and the release notes
        env:
          # Only a tag push checks the tag against the workspace version.
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          docker run --rm --memory 12g --memory-swap 12g -e CI=true -e CARGO_TERM_COLOR -e CARGO_BUILD_JOBS -e RELEASE_TAG \
            -v "$PWD:/src" \
            helikodu-ci:debian sh -euxc '
              git config --global --add safe.directory /src
              apt-get update
              apt-get install -y --no-install-recommends xz-utils
              rustup toolchain install

              out=/src/target/release-source
              rm -rf "$out"
              if [ -n "$RELEASE_TAG" ]; then
                cargo xtask dist --out "$out" --tag "$RELEASE_TAG"
              else
                cargo xtask dist --out "$out"
              fi
              rm -rf "$out/staging" "$out"/*.sha256
              ls -l "$out"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: target/release-source/
          if-no-files-found: error

  build:
    name: Test and build (${{ matrix.arch }}, Debian 13)
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      # One architecture failing stops the release; the other still reports.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            # GitHub's native arm64 runner (free for public repositories);
            # no emulation, so the tests run on the real architecture.
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: target/release-source
      # No cache: release files are built from a clean state only.
      - name: Build container
        run: docker build -t helikodu-ci:debian -f ci/containers/debian.Containerfile ci/containers
      - name: Test, then build from the source tarball
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --memory 12g --memory-swap 12g -e CI=true -e CARGO_TERM_COLOR -e CARGO_BUILD_JOBS -e ARCH \
            -v "$PWD:/src" \
            helikodu-ci:debian sh -euxc '
              git config --global --add safe.directory /src
              apt-get update
              apt-get install -y --no-install-recommends appstream desktop-file-utils gettext xz-utils
              rustup toolchain install

              # The container must be the architecture the files are named for.
              case "$(uname -m)" in
                "$ARCH") ;;
                *) echo "built on $(uname -m), expected $ARCH" >&2; exit 1 ;;
              esac

              cargo xtask ci --tests-only

              version=$(sed -n "/^\[workspace.package\]/,/^\[/s/^version = \"\(.*\)\"/\1/p" Cargo.toml)
              name="helikodu-$version"
              source_tarball="/src/target/release-source/$name.tar.xz"
              out=/src/target/release-assets
              rm -rf "$out"
              mkdir -p "$out"
              epoch=$(git log -1 --format=%ct)

              # The binaries are built from the source tarball, offline, as a
              # packager would build them.
              mkdir -p /tmp/source
              tar -xJf "$source_tarball" -C /tmp/source
              cd "/tmp/source/$name"
              meson setup /tmp/build --prefix=/usr/local --buildtype=release \
                -Doffline=true -Dbundled_sqlite=true
              meson compile -C /tmp/build
              meson test -C /tmp/build --print-errorlogs
              meson install -C /tmp/build --destdir /tmp/stage

              binary="helikodu-$version-$ARCH-linux"
              mkdir -p "/tmp/pack/$binary"
              cp -a /tmp/stage/usr/local/. "/tmp/pack/$binary/"
              # Every language of po/LINGUAS is in the archive.
              for lang in $(sed "s/#.*//" po/LINGUAS); do
                test -s "/tmp/pack/$binary/share/locale/$lang/LC_MESSAGES/helikodu.mo"
              done
              cp LICENSE README.md CHANGELOG.md "/tmp/pack/$binary/"
              cat > "/tmp/pack/$binary/INSTALL.txt" <<EOF
          Helikodu $version for $ARCH Linux

          Built on Debian 13 for the prefix /usr/local. It needs these libraries
          from the system, or newer versions with the same library names:
          glibc 2.41, GTK 4.18, FFmpeg 7.1 (libavformat.so.61, libavcodec.so.61,
          libavutil.so.59), PipeWire 1.2, ALSA, libopenmpt (libopenmpt.so.0),
          libgme (libgme.so.0) and libsidplayfp (libsidplayfp.so.6). SQLite is
          built in. Install the libraries that are missing from the packages
          of the distribution.
          Where a system has moved on to newer FFmpeg libraries, build from the
          source tarball instead (see "Building from source" in README.md).

          Install (bin/, libexec/ and share/ go into /usr/local):

            sudo cp -r bin libexec share /usr/local/
            sudo gtk4-update-icon-cache -q -t -f /usr/local/share/icons/hicolor
            sudo update-desktop-database -q /usr/local/share/applications

          The programs must stay in /usr/local: the scan worker is looked up
          in ../libexec/helikodu/ beside them, and the D-Bus service file and
          the user guide use /usr/local paths. The translations are found in
          ../share/locale/ beside the programs.

          Uninstall:

            sudo rm /usr/local/bin/helikodu /usr/local/bin/helikodu-cli
            sudo rm -r /usr/local/libexec/helikodu /usr/local/share/helikodu
            sudo rm /usr/local/share/applications/io.github.sorrelfox.Helikodu.desktop
            sudo rm /usr/local/share/metainfo/io.github.sorrelfox.Helikodu.metainfo.xml
            sudo rm /usr/local/share/dbus-1/services/io.github.sorrelfox.Helikodu.service
            sudo rm /usr/local/share/icons/hicolor/*/apps/io.github.sorrelfox.Helikodu*.svg
            sudo rm /usr/local/share/man/man1/helikodu.1 /usr/local/share/man/man1/helikodu-cli.1
            sudo rm /usr/local/share/man/man1/helikodu-scan-worker.1
            sudo rm /usr/local/share/locale/*/LC_MESSAGES/helikodu.mo
          EOF
              # One archive, compressed twice: .tar.xz and .tar.gz hold the
              # same files.
              tar --create --file=/tmp/pack.tar --sort=name --format=posix \
                  --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
                  --mtime="@$epoch" --owner=0 --group=0 --numeric-owner \
                  --mode=u+rw,go+r,go-w --directory /tmp/pack "$binary"
              xz --compress --stdout -6 --threads=1 /tmp/pack.tar > "$out/$binary.tar.xz"
              gzip --no-name --best --stdout /tmp/pack.tar > "$out/$binary.tar.gz"
              ls -l "$out"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.arch }}
          path: target/release-assets/
          if-no-files-found: error

  appimage:
    name: AppImage (${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: target/release-source
      # Builds from the source tarball, offline, in the Debian 13 container of
      # build-aux/appimage, with a minimal FFmpeg and vgmstream built in it;
      # the pinned tools and sources are checked against their SHA-256. See
      # docs/dev/appimage.md.
      - name: Build the AppImage
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eux
          case "$(uname -m)" in
            "$ARCH") ;;
            *) echo "runs on $(uname -m), expected $ARCH" >&2; exit 1 ;;
          esac
          version=$(sed -n "/^\[workspace.package\]/,/^\[/s/^version = \"\(.*\)\"/\1/p" Cargo.toml)
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          HELIKODU_CONTAINER_ENGINE=docker build-aux/appimage/build.sh \
            --source "target/release-source/helikodu-$version.tar.xz" \
            --offline --out target/appimage --cache "$RUNNER_TEMP/appimage-cache"
          mkdir -p target/release-appimage
          cp "target/appimage/Helikodu-$version-$ARCH.AppImage" target/release-appimage/
          # The FFmpeg and vgmstream source archives the images were built
          # from are published with them (once, from the x86_64 job), checked
          # against the pinned checksums.
          if [ "$ARCH" = x86_64 ]; then
            . build-aux/appimage/pins.sh
            cd target/appimage
            echo "$FFMPEG_SHA256  ffmpeg-$FFMPEG_VERSION.tar.xz" | sha256sum --check
            echo "$VGMSTREAM_SHA256  vgmstream-$VGMSTREAM_VERSION.tar.gz" | sha256sum --check
            cp "ffmpeg-$FFMPEG_VERSION.tar.xz" "vgmstream-$VGMSTREAM_VERSION.tar.gz" ../release-appimage/
            cd ../..
          fi
          ls -l target/release-appimage
      - uses: actions/upload-artifact@v4
        with:
          name: release-appimage-${{ matrix.arch }}
          path: target/release-appimage/
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle (${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # Flathub's image (amd64 and arm64) with flatpak-builder, the linter and
    # the GNOME 51 runtime and SDK. flatpak-builder needs bubblewrap, hence the
    # privileged container; the memory cap keeps the build under the 12 GB
    # limit (ci/README.md). See docs/dev/flatpak.md.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged --memory 12g --memory-swap 12g
    steps:
      # The manifest builds the checked-out tag (its `dir` source); the
      # crates come from cargo-sources.json, so the build is offline.
      - uses: actions/checkout@v4
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eux
          case "$(uname -m)" in
            "$ARCH") ;;
            *) echo "built on $(uname -m), expected $ARCH" >&2; exit 1 ;;
          esac
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # No cache: release files are built from a clean state only.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --install-deps-from=flathub --jobs="$CARGO_BUILD_JOBS" \
            --state-dir="$RUNNER_TEMP/state" --repo="$RUNNER_TEMP/repo" \
            "$RUNNER_TEMP/build" packaging/flatpak/io.github.sorrelfox.Helikodu.yml
      - name: Lint
        run: |
          set -eux
          # The metainfo has no screenshots until the Flathub submission;
          # every other finding fails the release.
          cat > "$RUNNER_TEMP/lint-exceptions.json" <<'EOF'
          {
            "io.github.sorrelfox.Helikodu": {
              "metainfo-missing-screenshots": "Screenshots are added for the Flathub submission",
              "appstream-screenshots-not-mirrored-in-ostree": "Screenshots are added for the Flathub submission",
              "finish-args-login1-system-talk-name": "Pauses playback before suspend and on screen lock through logind (docs/dev/flatpak.md)",
              "finish-args-own-name-wildcard-org.freedesktop.ReserveDevice1": "Reserves a sound card for exclusive ALSA output; the card name is part of the bus name (docs/dev/flatpak.md)"
            }
          }
          EOF
          flatpak-builder-lint --exceptions --user-exceptions "$RUNNER_TEMP/lint-exceptions.json" repo "$RUNNER_TEMP/repo"
      - name: Bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eux
          version=$(sed -n "/^\[workspace.package\]/,/^\[/s/^version = \"\(.*\)\"/\1/p" Cargo.toml)
          out="$GITHUB_WORKSPACE/target/release-flatpak"
          rm -rf "$out"
          mkdir -p "$out"
          bundle="$out/helikodu-$version-$ARCH.flatpak"
          # The Flathub remote in the bundle lets `flatpak install --bundle`
          # install the GNOME runtime with it.
          flatpak build-bundle --arch="$ARCH" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$RUNNER_TEMP/repo" "$bundle" io.github.sorrelfox.Helikodu
          # The bundle installs, is the version and architecture it is named
          # for, and both programs start.
          flatpak install --user --noninteractive --bundle "$bundle"
          flatpak info --user io.github.sorrelfox.Helikodu | tee "$RUNNER_TEMP/info"
          grep -Eq "^ *Version: $version\$" "$RUNNER_TEMP/info"
          grep -Eq "^ *Arch: $ARCH\$" "$RUNNER_TEMP/info"
          # The container has no user session; flatpak run needs a runtime
          # folder, with a short path for the sockets it makes there.
          XDG_RUNTIME_DIR=$(mktemp -d)
          export XDG_RUNTIME_DIR
          flatpak run --user --no-documents-portal io.github.sorrelfox.Helikodu --version | grep -Fx "helikodu $version"
          flatpak run --user --no-documents-portal --command=helikodu-cli io.github.sorrelfox.Helikodu --version
          ls -l "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: target/release-flatpak/
          if-no-files-found: error

  rpm:
    name: Fedora RPM (${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      # Fedora's flags add full debug information, which the build without it
      # does not have: with six jobs its peak in a 12 GB container was 11.5 GB
      # (page cache included). Three jobs and line tables only (still enough
      # for the -debuginfo package's backtraces, which are not published)
      # keep it well below the limit; see docs/dev/packaging-rpm.md.
      CARGO_BUILD_JOBS: 3
      HELIKODU_EXTRA_RUSTFLAGS: -C debuginfo=line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: target/release-source
      # Built with rpmbuild from the source tarball, offline, against Fedora's
      # libraries (ffmpeg-free), then installed in a second, clean container.
      - name: Build, lint and install the RPM
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -eux
          case "$(uname -m)" in
            "$ARCH") ;;
            *) echo "runs on $(uname -m), expected $ARCH" >&2; exit 1 ;;
          esac
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          image="registry.fedoraproject.org/fedora:$FEDORA_RELEASE"
          docker run --rm --memory 12g --memory-swap 12g \
            -e CARGO_BUILD_JOBS -e HELIKODU_EXTRA_RUSTFLAGS -e SOURCE_DATE_EPOCH \
            -v "$PWD:/src" "$image" \
            sh /src/packaging/rpm/build.sh "/src/target/release-source/helikodu-$version.tar.xz" /src/target/rpm
          # A pre-release is the RPM version 0.9.0~rc1; the file is published
          # with a dot in place of the tilde, which GitHub does not keep.
          rpm_version=$(echo "$version" | tr - '~')
          file="helikodu-$rpm_version-1.fc$FEDORA_RELEASE.$ARCH.rpm"
          test -f "target/rpm/$file"
          docker run --rm --memory 12g --memory-swap 12g \
            -v "$PWD:/src" "$image" \
            sh /src/packaging/rpm/smoke-test.sh "/src/target/rpm/$file"
          mkdir -p target/release-rpm
          cp "target/rpm/$file" "target/release-rpm/$(echo "$file" | tr '~' .)"
          ls -l target/release-rpm
      - uses: actions/upload-artifact@v4
        with:
          name: release-rpm-${{ matrix.arch }}
          path: target/release-rpm/
          if-no-files-found: error

  deb:
    name: Debian package (${{ matrix.distro }}, ${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # One package per distribution: their FFmpeg, GTK and other library
        # versions differ, so a package built on one does not install on the
        # other. See docs/dev/packaging-deb.md.
        distro: ["debian:13", "ubuntu:26.04"]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: target/release-source
      - name: Build the package from the source tarball
        env:
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eux
          case "$(uname -m)" in
            "$ARCH") ;;
            *) echo "runs on $(uname -m), expected $ARCH" >&2; exit 1 ;;
          esac
          version=$(sed -n "/^\[workspace.package\]/,/^\[/s/^version = \"\(.*\)\"/\1/p" Cargo.toml)
          epoch=$(git log -1 --format=%ct)
          docker run --rm --memory 12g --memory-swap 12g -e CARGO_BUILD_JOBS -e SOURCE_DATE_EPOCH="$epoch" \
            -v "$PWD:/src" "docker.io/library/$DISTRO" \
            sh /src/packaging/deb/build-deb.sh "/src/target/release-source/helikodu-$version.tar.xz" /src/target/release-deb
      - name: Install, try and remove the package in a fresh container
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -eux
          for deb in target/release-deb/*.deb; do
            docker run --rm --memory 12g --memory-swap 12g -v "$PWD:/src:ro" "docker.io/library/$DISTRO" \
              sh /src/packaging/deb/test-deb.sh "/src/$deb"
          done
      - name: Name the artifact
        id: name
        env:
          DISTRO: ${{ matrix.distro }}
          ARCH: ${{ matrix.arch }}
        run: echo "name=release-deb-$(echo "$DISTRO" | tr -d :)-$ARCH" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: target/release-deb/*.deb
          if-no-files-found: error

  arch:
    name: Arch Linux package (x86_64)
    needs: source
    # x86_64 only: the archlinux image has no arm64 variant (Arch Linux ARM
    # is a separate project).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: target/release-source
      # Builds with makepkg from the source tarball, offline, checks the
      # package with namcap, installs it, tries the programs and removes it.
      - name: Build, check and try the package
        run: |
          set -eux
          version=$(sed -n "/^\[workspace.package\]/,/^\[/s/^version = \"\(.*\)\"/\1/p" Cargo.toml)
          mkdir -p target/release-arch
          docker run --rm --memory 12g --memory-swap 12g -e CARGO_BUILD_JOBS \
            -v "$PWD:/src:ro" -v "$PWD/target/release-arch:/out" \
            docker.io/library/archlinux:latest \
            sh /src/packaging/arch/build-package.sh "/src/target/release-source/helikodu-$version.tar.xz" /out
          ls -l target/release-arch
      - uses: actions/upload-artifact@v4
        with:
          name: release-arch
          path: target/release-arch/
          if-no-files-found: error

  assemble:
    name: Collect the release files and their checksums
    needs: [source, build, appimage, flatpak, rpm, deb, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Checksums
        run: |
          set -eux
          cd release-assets
          ls -l
          # GitHub renames uploaded files with a tilde in their name, and
          # SHA256SUMS must name the files as they are published.
          for file in *~*; do
            if [ -e "$file" ]; then echo "a tilde in $file" >&2; exit 1; fi
          done
          # Every release file: the source tarball, the programs (.tar.xz,
          # .tar.gz), the AppImages, the FFmpeg and vgmstream sources
          # (.tar.xz, .tar.gz), the Flatpak bundles and the packages.
          sha256sum ./*.tar.xz ./*.tar.gz ./*.AppImage ./*.flatpak ./*.rpm ./*.deb ./*.pkg.tar.zst \
            | sed "s| \./| |" > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: assemble
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eux
          version=${TAG#v}
          # Every 0.x version and every version with a suffix (-rc1) is a pre-release.
          prerelease=
          case "$version" in
            0.* | *-*) prerelease=--prerelease ;;
          esac
          # The package versions of a pre-release (0.9.0-rc1): 0.9.0~rc1 for
          # RPM and dpkg, published with a dot in place of the tilde, and
          # 0.9.0rc1 for pacman.
          dotted=$(echo "$version" | tr - .)
          pacman_version=${version//-/}
          files=("helikodu-$version.tar.xz")
          for arch in x86_64 aarch64; do
            files+=(
              "helikodu-$version-$arch-linux.tar.xz"
              "helikodu-$version-$arch-linux.tar.gz"
              "Helikodu-$version-$arch.AppImage"
              "helikodu-$version-$arch.flatpak"
              "helikodu-$dotted-1.fc$FEDORA_RELEASE.$arch.rpm"
            )
          done
          for debarch in amd64 arm64; do
            files+=(
              "helikodu_$dotted-1.debian13_$debarch.deb"
              "helikodu_$dotted-1.ubuntu26.04_$debarch.deb"
            )
          done
          files+=("helikodu-$pacman_version-1-x86_64.pkg.tar.zst")
          cd release-assets
          files+=(ffmpeg-*.tar.xz vgmstream-*.tar.gz)
          sha256sum --check SHA256SUMS
          # SHA256SUMS lists exactly the files that are published.
          diff <(printf '%s\n' "${files[@]}" | sort) <(sed 's/^[0-9a-f]*  //' SHA256SUMS | sort)
          gh release create "$TAG" \
            --verify-tag \
            --title "Helikodu $version" \
            --notes-file release-notes.md \
            $prerelease \
            "${files[@]}" \
            SHA256SUMS
