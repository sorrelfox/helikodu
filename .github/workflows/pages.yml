# Publishes docs/site to GitHub Pages at https://sorrelfox.github.io/helikodu/.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "data/icons/hicolor/scalable/apps/io.github.sorrelfox.Helikodu.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          mkdir _site
          cp docs/site/index.html docs/site/style.css _site/
          cp data/icons/hicolor/scalable/apps/io.github.sorrelfox.Helikodu.svg _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
