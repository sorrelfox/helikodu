# Publishes the website (docs/site) to GitHub Pages at https://sorrelfox.github.io/helikodu/.
name: Pages

# Runs for release tags and when started by hand, to save shared CI resources.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build the site
        # The pages, the user guide, the release notes and the pictures. The
        # script names the version of Cargo.toml and fails on a broken link.
        run: python3 docs/site/build.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
