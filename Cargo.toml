[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "tests/system/offline-launcher", "xtask"]
# Fuzz targets need a nightly toolchain and the spikes are throwaway experiments.
exclude = ["fuzz", "spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Minimum supported Rust version: the latest stable release minus two.
rust-version = "1.98"
license = "GPL-3.0-or-later"
authors = ["sorrelfox and Helikodu contributors"]
repository = "https://github.com/sorrelfox/helikodu"
publish = false

# Every version, internal and third-party, is set here and only here.
[workspace.dependencies]
# Native ALSA output. Pinned to the version cpal uses (0.11 with cpal 0.18): two
# alsa-sys versions cannot be linked into one build, so both move together.
alsa = "0.11"
anyhow = "1"
# Guesses the legacy charset of tag text that is not valid in its declared encoding.
chardetng = "1"
# Argument parsing of the command-line tool.
clap = { version = "4.6", features = ["derive"] }
# Raw terminal mode and key events for the command-line tool's interactive keys.
crossterm = { version = "0.29", default-features = false, features = ["events"] }
# Decodes legacy charsets (cp1251, Shift-JIS, GBK, …) in tags and CUE sheets.
encoding_rs = "0.8"
# Raw FFmpeg bindings; the safe layer is `ffmpeg-bridge`. Only libavformat (with
# libavcodec and libavutil), linked dynamically through pkg-config.
ffmpeg-sys-next = { version = "=9.1.1", default-features = false, features = ["avformat"] }
helikodu-engine = { path = "crates/engine", default-features = false }
helikodu-extra-decoders = { path = "crates/extra-decoders", default-features = false }
helikodu-ffmpeg-bridge = { path = "crates/ffmpeg-bridge" }
helikodu-library = { path = "crates/library" }
helikodu-meta = { path = "crates/meta" }
helikodu-model = { path = "crates/model" }
helikodu-service = { path = "crates/service", default-features = false }
# Locale-aware sort order of the library: a custom SQLite collation. Unicode-3.0.
# The compiled data is the CLDR collation data for every locale.
icu_collator = "2.4"
# Parses the locale that selects the collation.
icu_locale_core = "2.4"
# Normalization (NFKD, NFC) for the folded search and grouping form.
icu_normalizer = "2.4"
# Cover decoding and thumbnails: JPEG, PNG and WebP only. No default features, so
# no other format, no AVIF (it would need dav1d) and no thread pool.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
# Tag reading and writing in pure Rust; FFmpeg is the read-only fallback for the
# formats it lacks (Matroska, ASF/WMA, DSF, DFF, TAK, TTA).
lofty = "0.25.5"
# Library folder watching. inotify only (no async runtime); periodic rescans where it
# cannot see changes.
notify = { version = "8.2.2", default-features = false }
# Native PipeWire output; the crate is young, so the version is exact.
pipewire = { version = "=0.10.1", features = ["v1_2_0"] }
# Property tests (development only). No default features: no forking or regex strategies.
proptest = { version = "1.11", default-features = false, features = ["std"] }
# XML reading for XSPF playlists. No default features: UTF-8 only (other charsets are
# decoded before parsing) and no async or serde support.
quick-xml = { version = "0.42", default-features = false }
# The `regexp()` SQL function behind the query language's `~` operator.
regex = "1.12"
# Resource limits (address space, core dumps) that scan workers set on themselves.
rlimit = "0.11"
# Lock-free ring buffer between render thread and output; 0.4.1 fixed a double-free.
rtrb = "0.4.1"
# Resampling. Its API changes often, so the version is exact and the engine wraps it
# behind its own trait.
rubato = "=5.1.0"
# SQLite for the library database. Needs SQLite 3.43 or newer with FTS5; the library
# crate's `bundled-sqlite` feature builds the bundled copy instead of linking the system one.
rusqlite = { version = "0.43", default-features = false, features = ["cache", "collation", "functions"] }
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1"
# D-Bus for the desktop integrations (device reservation). Only its own executor
# (`default-rt`, no tokio) and the object server; it still builds `socket2` and its
# TCP transport code, which the program never uses (only the session bus socket).
zbus = { version = "6.3", default-features = false, features = ["default-rt", "service"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Every `unsafe` block explains why it is sound.
undocumented_unsafe_blocks = "warn"
# A module is one file; a folder sits beside a file of the same name. No `mod.rs`.
mod_module_files = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
