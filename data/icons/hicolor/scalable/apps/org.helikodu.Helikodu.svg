<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="10" x2="0" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#363841"/>
      <stop offset="1" stop-color="#1B1C20"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="10" x2="0" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="24" x2="0" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8C55A"/>
      <stop offset="1" stop-color="#EAA02C"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="60" x2="0" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F5F6"/>
      <stop offset="1" stop-color="#C9CCD2"/>
    </linearGradient>
  </defs>
  <!-- Tile: base edge for depth, then the face. -->
  <rect x="12" y="14" width="104" height="104" rx="22" fill="#0D0E10"/>
  <rect x="12" y="10" width="104" height="104" rx="22" fill="url(#tile)"/>
  <rect x="13" y="11" width="102" height="102" rx="21" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <!-- Soft shadow under the mark. -->
  <g fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 2)">
    <path d="M28 62 64 30l36 32"/>
    <path d="M40 80v8M64 68v20M88 80v8" stroke-width="16"/>
  </g>
  <!-- Roof: the chevron in the accent colour. -->
  <path d="M28 62 64 30l36 32" fill="none" stroke="url(#roof)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sound: three level bars. -->
  <path d="M40 80v8M64 68v20M88 80v8" fill="none" stroke="url(#bars)" stroke-width="16" stroke-linecap="round"/>
</svg>
