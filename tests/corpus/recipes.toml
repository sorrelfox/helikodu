# Recipes for the generated test corpus. `cargo xtask corpus` reads this file
# and writes the files to target/corpus/. The format is described in README.md
# in this folder.

# ---------------------------------------------------------------------------
# Sources: signals written by xtask itself, bit-identical on every machine.
# A linear sweep from 20 Hz with -40 dBFS noise; each channel starts the sweep
# at a different point.

[[source]]
name = "s44-16"
sample_rate = 44100
channels = 2
encoding = "s16"
frames = 88200
signal = "sweep-noise"

[[source]]
name = "s44-f32"
sample_rate = 44100
channels = 2
encoding = "f32"
frames = 88200
signal = "sweep-noise"

[[source]]
name = "s22-16"
sample_rate = 22050
channels = 2
encoding = "s16"
frames = 44100
signal = "sweep-noise"

[[source]]
name = "s48-16"
sample_rate = 48000
channels = 2
encoding = "s16"
frames = 96000
signal = "sweep-noise"

[[source]]
name = "s96-24"
sample_rate = 96000
channels = 2
encoding = "s24"
frames = 192000
signal = "sweep-noise"

[[source]]
name = "c51-48-24"
sample_rate = 48000
channels = 6
encoding = "s24"
frames = 48000
signal = "sweep-noise"

[[source]]
name = "m8-16"
sample_rate = 8000
channels = 1
encoding = "s16"
frames = 16000
signal = "sweep-noise"

[[source]]
name = "m11-16"
sample_rate = 11025
channels = 1
encoding = "s16"
frames = 22050
signal = "sweep-noise"

[[source]]
name = "m16-16"
sample_rate = 16000
channels = 1
encoding = "s16"
frames = 32000
signal = "sweep-noise"

[[source]]
name = "m22-16"
sample_rate = 22050
channels = 1
encoding = "s16"
frames = 44100
signal = "sweep-noise"

[[source]]
name = "m48-16"
sample_rate = 48000
channels = 1
encoding = "s16"
frames = 96000
signal = "sweep-noise"

# The gapless references. The split points are not multiples of any codec's
# frame size (576, 960, 1024, 1152, 4096 …).
[[source]]
name = "gapless-44k1"
sample_rate = 44100
channels = 2
encoding = "s16"
frames = 220500
signal = "sweep-noise"
seed = 2
split = [44101, 103333, 170017]

[[source]]
name = "gapless-48k"
sample_rate = 48000
channels = 2
encoding = "s16"
frames = 240000
signal = "sweep-noise"
seed = 3
split = [48017, 112211, 185557]

# ---------------------------------------------------------------------------
# Formats: one sample per codec and container. Each distinct `format` label
# counts once; variants (bit depth, channel layout, bit-rate mode) share it.

# PCM and simple codecs in WAV.

[[sample]]
set = "formats"
name = "pcm/wav-s16.wav"
format = "WAV, PCM 16-bit"
source = "s44-16"
tool = "ffmpeg"
args = ["-c:a", "pcm_s16le"]
needs = ["encoder:pcm_s16le", "muxer:wav"]
expect = { demuxer = "wav", codec = "pcm_s16le", exact_length = true }

