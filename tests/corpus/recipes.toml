# Three audio streams in different languages; the second is the default.
[[sample]]
set = "video"
name = "multi-audio.mkv"
source = "s48-16"
tool = "ffmpeg"
args = [
    "-f", "lavfi", "-i", "testsrc2=size=160x120:rate=25:duration=2",
    "-map", "1:v", "-map", "0:a", "-map", "0:a", "-map", "0:a",
    "-c:v", "libvpx-vp9", "-deadline", "realtime", "-cpu-used", "8", "-b:v", "200k",
    "-c:a:0", "libopus", "-b:a:0", "96k",
    "-c:a:1", "ac3", "-b:a:1", "192k",
    "-c:a:2", "flac",
    "-metadata:s:a:0", "language=eng",
    "-metadata:s:a:1", "language=deu",
    "-metadata:s:a:2", "language=fin",
    "-disposition:a:0", "0", "-disposition:a:1", "default", "-disposition:a:2", "0",
]
needs = ["encoder:libvpx-vp9", "encoder:libopus", "encoder:ac3", "encoder:flac", "muxer:matroska"]
expect = { demuxer = "matroska,webm", codec = "opus", audio_streams = 3, video_streams = 1 }

