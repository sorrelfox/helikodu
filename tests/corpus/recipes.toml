# ---------------------------------------------------------------------------
# Gapless: the reference split into four parts at points that are not frame
# boundaries, each part encoded on its own. Played back to back, the parts
# must give the reference again (bit-exact for lossless codecs,
# sample-exact length for lossy ones).

[[sample]]
set = "gapless"
name = "reference-44k1.wav"
source = "gapless-44k1"
tool = "copy"

[[sample]]
set = "gapless"
name = "reference-48k.wav"
source = "gapless-48k"
tool = "copy"

[[sample]]
set = "gapless"
name = "wav/{part}.wav"
source = "gapless-44k1"
parts = true
tool = "copy"
expect = { codec = "pcm_s16le", exact_length = true }

[[sample]]
set = "gapless"
name = "flac/{part}.flac"
source = "gapless-44k1"
parts = true
tool = "flac"
args = ["--silent", "--force", "-o", "{output}", "{input}"]
expect = { codec = "flac", exact_length = true }

[[sample]]
set = "gapless"
name = "wavpack/{part}.wv"
source = "gapless-44k1"
parts = true
tool = "wavpack"
args = ["-q", "-y", "{input}", "-o", "{output}"]
expect = { codec = "wavpack", exact_length = true }

[[sample]]
set = "gapless"
name = "tta/{part}.tta"
source = "gapless-44k1"
parts = true
tool = "ffmpeg"
args = ["-c:a", "tta"]
needs = ["encoder:tta", "muxer:tta"]
expect = { codec = "tta", exact_length = true }

[[sample]]
set = "gapless"
name = "alac/{part}.m4a"
source = "gapless-44k1"
parts = true
tool = "ffmpeg"
args = ["-c:a", "alac"]
needs = ["encoder:alac", "muxer:ipod"]
expect = { codec = "alac", exact_length = true }

[[sample]]
set = "gapless"
name = "mp3-lame/{part}.mp3"
source = "gapless-44k1"
parts = true
tool = "lame"
args = ["--quiet", "-V", "2", "{input}", "{output}"]
expect = { codec = "mp3", exact_length = true }

[[sample]]
set = "gapless"
name = "mp3-ffmpeg/{part}.mp3"
source = "gapless-44k1"
parts = true
tool = "ffmpeg"
args = ["-c:a", "libmp3lame", "-q:a", "2"]
needs = ["encoder:libmp3lame", "muxer:mp3"]
expect = { codec = "mp3", exact_length = true }

[[sample]]
set = "gapless"
name = "aac/{part}.m4a"
source = "gapless-44k1"
parts = true
tool = "ffmpeg"
args = ["-c:a", "aac", "-b:a", "128k"]
needs = ["encoder:aac", "muxer:ipod"]
expect = { codec = "aac", exact_length = true }

[[sample]]
set = "gapless"
name = "aac-fdk/{part}.m4a"
source = "gapless-44k1"
parts = true
tool = "ffmpeg"
args = ["-c:a", "libfdk_aac", "-b:a", "128k"]
needs = ["encoder:libfdk_aac", "muxer:ipod"]
expect = { codec = "aac", exact_length = true }

# Raw ADTS carries no gapless information: the parts are longer than the
# reference. Kept to test that the player does not pretend otherwise.
[[sample]]
set = "gapless"
name = "aac-adts/{part}.aac"
source = "gapless-44k1"
parts = true
tool = "ffmpeg"
args = ["-c:a", "aac", "-b:a", "128k"]
needs = ["encoder:aac", "muxer:adts"]
expect = { codec = "aac" }

[[sample]]
set = "gapless"
name = "vorbis/{part}.ogg"
source = "gapless-44k1"
parts = true
tool = "ffmpeg"
args = ["-c:a", "libvorbis", "-q:a", "4"]
needs = ["encoder:libvorbis", "muxer:ogg"]
expect = { codec = "vorbis", exact_length = true }

[[sample]]
set = "gapless"
name = "opus/{part}.opus"
source = "gapless-48k"
parts = true
tool = "opusenc"
args = ["--quiet", "--serial", "1", "{input}", "{output}"]
expect = { codec = "opus", exact_length = true }

[[sample]]
set = "gapless"
name = "opus-webm/{part}.webm"
source = "gapless-48k"
parts = true
tool = "ffmpeg"
args = ["-c:a", "libopus", "-b:a", "96k"]
needs = ["encoder:libopus", "muxer:webm"]
expect = { codec = "opus", exact_length = true }

# ---------------------------------------------------------------------------
# Video: the player must play the audio stream and never decode the video.
# The picture is FFmpeg's test pattern, 2 s at 25 frames per second.

[[sample]]
set = "video"
name = "h264-aac.mp4"
source = "s48-16"
tool = "ffmpeg"
args = ["-f", "lavfi", "-i", "testsrc2=size=160x120:rate=25:duration=2", "-map", "1:v", "-map", "0:a", "-c:v", "libx264", "-preset", "veryfast", "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "96k"]
needs = ["encoder:libx264", "encoder:aac", "muxer:mp4"]
expect = { demuxer = "mov,mp4,m4a,3gp,3g2,mj2", codec = "aac", audio_streams = 1, video_streams = 1 }

