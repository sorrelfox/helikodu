set = "cue"
name = "multi/{part}.flac"
source = "cue-44"
parts = true
tool = "ffmpeg"
args = ["-c:a", "flac"]
needs = ["encoder:flac", "muxer:flac"]
expect = { demuxer = "flac", codec = "flac", exact_length = true }

