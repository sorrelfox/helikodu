tool = "ffmpeg"
args = ["-c:a", "libopus", "-b:a", "96k"]
needs = ["encoder:libopus", "muxer:webm"]
expect = { codec = "opus", exact_length = true }

# ---------------------------------------------------------------------------
# Video: the player must play the audio stream and never decode the video.
# The picture is FFmpeg's test pattern, 2 s at 25 frames per second.

[[sample]]
set = "video"
name = "h264-aac.mp4"
source = "s48-16"
tool = "ffmpeg"
args = ["-f", "lavfi", "-i", "testsrc2=size=160x120:rate=25:duration=2", "-map", "1:v", "-map", "0:a", "-c:v", "libx264", "-preset", "veryfast", "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "96k"]
needs = ["encoder:libx264", "encoder:aac", "muxer:mp4"]
expect = { demuxer = "mov,mp4,m4a,3gp,3g2,mj2", codec = "aac", audio_streams = 1, video_streams = 1 }

