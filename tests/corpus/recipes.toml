# ---------------------------------------------------------------------------
# CUE sheets: single-file and multi-file sheets, a sheet embedded in a FLAC
# file, pregaps (INDEX 00), hidden track one audio, and sheets in Windows-1251,
# Shift-JIS, Latin-1 and UTF-8 with a byte order mark. The audio is 8 s of
# silence; the tracks start at 00:00:00, 00:02:50 and 00:05:25 (CUE times are
# MM:SS:FF, 75 frames a second). `expect.cue` lists the tracks a reader must
# find, `expect.tags` the album fields every track carries.

[[sample]]
set = "cue"
name = "single/album.flac"
source = "cue-44"
tool = "ffmpeg"
args = ["-c:a", "flac"]
needs = ["encoder:flac", "muxer:flac"]
expect = { demuxer = "flac", codec = "flac", exact_length = true }

# One file, three tracks; the second has a pregap from 00:02:20.
[[sample]]
set = "cue"
name = "single/album.cue"
tool = "text"
text = """
REM GENRE "Ambient"
REM DATE 2004
PERFORMER "Cue Artist"
TITLE "Single-File Album"
FILE "album.flac" WAVE
  TRACK 01 AUDIO
    TITLE "Opening"
    INDEX 01 00:00:00
  TRACK 02 AUDIO
    TITLE "Middle"
    PERFORMER "Guest Artist"
    INDEX 00 00:02:20
    INDEX 01 00:02:50
  TRACK 03 AUDIO
    TITLE "Closing"
    INDEX 01 00:05:25
"""
[sample.expect.tags]
album = "Single-File Album"
album_artist = "Cue Artist"
genres = ["Ambient"]
date = "2004"
[[sample.expect.cue]]
number = 1
file = "album.flac"
start = "00:00:00"
end = "00:02:50"
title = "Opening"
artist = "Cue Artist"
[[sample.expect.cue]]
number = 2
file = "album.flac"
start = "00:02:50"
