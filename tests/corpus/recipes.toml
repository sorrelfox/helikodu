    TITLE "Part One"
    INDEX 01 00:00:00
  TRACK 02 AUDIO
    TITLE "Part Two"
    INDEX 00 00:02:00
FILE "part2.flac" WAVE
    INDEX 01 00:00:00
  TRACK 03 AUDIO
