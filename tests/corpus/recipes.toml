# ---------------------------------------------------------------------------
# Gapless: the reference split into four parts at points that are not frame
# boundaries, each part encoded on its own. Played back to back, the parts
# must give the reference again (bit-exact for lossless codecs,
# sample-exact length for lossy ones).

[[sample]]
set = "gapless"
name = "reference-44k1.wav"
source = "gapless-44k1"
tool = "copy"

[[sample]]
set = "gapless"
name = "reference-48k.wav"
source = "gapless-48k"
tool = "copy"

[[sample]]
set = "gapless"
name = "wav/{part}.wav"
source = "gapless-44k1"
parts = true
tool = "copy"
expect = { codec = "pcm_s16le", exact_length = true }

[[sample]]
set = "gapless"
name = "flac/{part}.flac"
source = "gapless-44k1"
parts = true
tool = "flac"
args = ["--silent", "--force", "-o", "{output}", "{input}"]
expect = { codec = "flac", exact_length = true }

[[sample]]
set = "gapless"
name = "wavpack/{part}.wv"
source = "gapless-44k1"
parts = true
tool = "wavpack"
args = ["-q", "-y", "{input}", "-o", "{output}"]
expect = { codec = "wavpack", exact_length = true }

[[sample]]
set = "gapless"
name = "tta/{part}.tta"
source = "gapless-44k1"
parts = true
tool = "ffmpeg"
args = ["-c:a", "tta"]
needs = ["encoder:tta", "muxer:tta"]
expect = { codec = "tta", exact_length = true }

[[sample]]
set = "gapless"
name = "alac/{part}.m4a"
source = "gapless-44k1"
parts = true
tool = "ffmpeg"
args = ["-c:a", "alac"]
needs = ["encoder:alac", "muxer:ipod"]
expect = { codec = "alac", exact_length = true }

[[sample]]
set = "gapless"
name = "mp3-lame/{part}.mp3"
source = "gapless-44k1"
parts = true
tool = "lame"
args = ["--quiet", "-V", "2", "{input}", "{output}"]
expect = { codec = "mp3", exact_length = true }

[[sample]]
set = "gapless"
name = "mp3-ffmpeg/{part}.mp3"
source = "gapless-44k1"
parts = true
tool = "ffmpeg"
args = ["-c:a", "libmp3lame", "-q:a", "2"]
needs = ["encoder:libmp3lame", "muxer:mp3"]
expect = { codec = "mp3", exact_length = true }

[[sample]]
set = "gapless"
name = "aac/{part}.m4a"
source = "gapless-44k1"
parts = true
tool = "ffmpeg"
args = ["-c:a", "aac", "-b:a", "128k"]
needs = ["encoder:aac", "muxer:ipod"]
expect = { codec = "aac", exact_length = true }

[[sample]]
set = "gapless"
name = "aac-fdk/{part}.m4a"
source = "gapless-44k1"
parts = true
tool = "ffmpeg"
args = ["-c:a", "libfdk_aac", "-b:a", "128k"]
needs = ["encoder:libfdk_aac", "muxer:ipod"]
expect = { codec = "aac", exact_length = true }

# Raw ADTS carries no gapless information: the parts are longer than the
# reference. Kept to test that the player does not pretend otherwise.
[[sample]]
set = "gapless"
name = "aac-adts/{part}.aac"
