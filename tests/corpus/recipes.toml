# Builds of FDK AAC without SBR (such as fdk-aac-free) cannot make HE-AAC.
optional = true
expect = { demuxer = "mov,mp4,m4a,3gp,3g2,mj2", codec = "aac" }

[[sample]]
set = "formats"
name = "lossy/aac-latm.latm"
format = "LATM/LOAS, AAC-LC"
source = "s44-16"
tool = "ffmpeg"
args = ["-c:a", "aac", "-b:a", "128k"]
needs = ["encoder:aac", "muxer:latm"]
expect = { demuxer = "loas", codec = "aac_latm" }

[[sample]]
set = "formats"
name = "lossy/aac-lc.ts"
format = "MPEG-TS, AAC-LC"
