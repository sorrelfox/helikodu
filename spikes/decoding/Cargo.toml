# A standalone experiment: its own workspace, so it never joins the main one.
[workspace]

[package]
name = "decoding-spike"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
# Raw bindings only; the safe layer is written in this spike.
ffmpeg-sys-next = { version = "=9.1.1", default-features = false, features = ["avformat"] }
# dlsym(RTLD_NEXT) for the avcodec_open2 probe, errno values.
libc = "0.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
