[package]
name = "helikodu-cli"
description = "The command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "helikodu-cli"
path = "src/main.rs"

[features]
default = ["pipewire", "alsa", "dsd"]
# The native PipeWire output backend.
pipewire = ["helikodu-service/pipewire"]
# The native ALSA output backend.
alsa = ["helikodu-service/alsa"]
# The DSF/DFF reader, which plays DSD files as PCM.
dsd = ["helikodu-service/dsd"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
helikodu-model.workspace = true
helikodu-service.workspace = true
serde_json.workspace = true

[lints]
workspace = true
