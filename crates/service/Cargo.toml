[package]
name = "helikodu-service"
description = "The application core shared by every front end."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["pipewire", "alsa", "pulseaudio", "jack", "dsd", "openmpt", "gme", "sid", "midi"]
# The native PipeWire output backend of the engine.
pipewire = ["helikodu-engine/pipewire"]
# The native ALSA output backend of the engine.
alsa = ["helikodu-engine/alsa"]
# The PulseAudio output backend of the engine.
pulseaudio = ["helikodu-engine/pulseaudio"]
# The JACK output backend of the engine; building it needs `jack.pc`.
jack = ["helikodu-engine/jack"]
# The DSF/DFF reader of the engine.
dsd = ["helikodu-engine/dsd"]
# Tracker modules through libopenmpt.
openmpt = ["helikodu-engine/openmpt"]
# Game console music through libgme.
gme = ["helikodu-engine/gme"]
# C64 SID tunes through libsidplayfp.
sid = ["helikodu-engine/sid"]
# MIDI files through rustysynth and a SoundFont.
midi = ["helikodu-engine/midi"]
# Game audio streams through vgmstream (off by default: rarely packaged).
vgmstream = ["helikodu-engine/vgmstream"]
# Build the SQLite copy that rusqlite bundles instead of linking the system library.
bundled-sqlite = ["helikodu-library/bundled-sqlite"]

[dependencies]
helikodu-engine.workspace = true
helikodu-library.workspace = true
helikodu-model.workspace = true
log.workspace = true
notify.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
