[package]
name = "helikodu-ui-gtk"
description = "The GTK 4 front end: windows, views, widgets and style."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-channel.workspace = true
gettext-rs.workspace = true
gtk.workspace = true
helikodu-desktop.workspace = true
helikodu-model.workspace = true
helikodu-service.workspace = true
serde_json.workspace = true

[build-dependencies]
glib-build-tools.workspace = true

[[test]]
# GTK runs on the main thread only, so these tests bring their own main function.
name = "widgets"
harness = false

[[example]]
name = "screenshot"

[[test]]
# The dialogs against the sample backend; GTK needs its own main function.
name = "dialogs"
harness = false

[[example]]
name = "dialogs"

[[test]]
# Convert, Sync and export and the cover manager against the sample backend; GTK
# needs its own main function.
name = "tools"
harness = false

[[test]]
# The library views against the sample backend; GTK needs its own main function.
name = "views"
harness = false

[[example]]
name = "views"

[[test]]
# The Lyrics tab and Now Playing against the sample backend; GTK needs its own
# main function.
name = "lyrics"
harness = false

[[test]]
# The tag editor over the running service and a generated library; GTK needs its
# own main function.
name = "tag_editing"
harness = false

[[test]]
# The play modes against the sample backend; GTK needs its own main function.
name = "play_modes"
harness = false

[[test]]
