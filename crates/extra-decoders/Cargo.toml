[package]
name = "helikodu-extra-decoders"
description = "Decoders for the long tail of formats: tracker modules, game music, SID, MIDI and DSD files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["dsd"]
# The DSF and DSDIFF (DFF) reader, with conversion of DSD to PCM. Pure Rust.
dsd = ["dep:helikodu-model", "dep:thiserror"]

[dependencies]
helikodu-model = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[lints]
workspace = true
