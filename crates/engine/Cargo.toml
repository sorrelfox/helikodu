[package]
name = "helikodu-engine"
description = "The playback engine: decoding, processing, output backends and the transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["pipewire", "alsa", "dsd"]
# The native PipeWire output backend.
pipewire = ["dep:pipewire"]
# The native ALSA output backend.
alsa = ["dep:alsa"]
# The DSF/DFF reader of `extra-decoders`, which decodes DSD files to PCM.
dsd = ["dep:helikodu-extra-decoders", "helikodu-extra-decoders/dsd"]

[dependencies]
alsa = { workspace = true, optional = true }
helikodu-extra-decoders = { workspace = true, optional = true }
helikodu-ffmpeg-bridge.workspace = true
helikodu-model.workspace = true
pipewire = { workspace = true, optional = true }
rtrb.workspace = true
rubato.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Reading the corpus manifest and recipes in tests/corpus.
serde.workspace = true
toml.workspace = true

[lints]
workspace = true
