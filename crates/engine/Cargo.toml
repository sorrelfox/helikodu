[package]
name = "helikodu-engine"
description = "The playback engine: decoding, processing, output backends and the transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["pipewire", "alsa"]
# The native PipeWire output backend.
pipewire = ["dep:pipewire"]
# The native ALSA output backend.
alsa = ["dep:alsa"]

[dependencies]
alsa = { workspace = true, optional = true }
helikodu-model.workspace = true
pipewire = { workspace = true, optional = true }
rtrb.workspace = true
thiserror.workspace = true

[lints]
workspace = true
